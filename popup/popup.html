<!DOCTYPE html>

<html>

<head>
    <meta charset="UTF-8">
    <title>One-Click Resume</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>

    <div class="header">
        <img
            class="logo"
            src="../icons/icon48.png"
            alt="One-Click Resume logo"
        />
        <h2>One-Click Resume</h2>
    </div>

    <div class="description">
        Manage your saved resumes. The ⭐ default is
        uploaded by the widget's main button.
    </div>


    <div id="resumeList" class="resume-list"></div>


    <input
        id="resumeInput"
        type="file"
        accept=".pdf,.doc,.docx"
        multiple
        hidden
    />

    <button id="addButton" class="add-button">
        + Add Resume
    </button>


    <div id="status" class="status"></div>

    <script src="../storage/resume-db.js"></script>
    <script src="popup.js"></script>

</body>

</html>
