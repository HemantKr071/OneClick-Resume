<!DOCTYPE html>

<html>

<head>

    <meta charset="UTF-8">

    <title>
        Resume One-Click
    </title>

    <style>

        body {
            width: 320px;
            padding: 20px;
            margin: 0;

            font-family:
                Arial,
                sans-serif;

            background: #ffffff;
            color: #111827;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 8px;
        }

        .description {
            color: #6b7280;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .resume-box {
            padding: 12px;

            border: 1px solid #e5e7eb;
            border-radius: 8px;

            margin-bottom: 15px;
        }

        .file-name {
            font-weight: 600;
            word-break: break-word;
        }

        .file-size {
            margin-top: 4px;

            font-size: 12px;
            color: #6b7280;
        }

        input[type="file"] {
            width: 100%;
            margin-bottom: 12px;
        }

        button {
            width: 100%;

            padding: 10px;

            border: none;
            border-radius: 6px;

            background: #111827;
            color: white;

            cursor: pointer;

            font-weight: 600;
        }

        button:hover {
            opacity: 0.9;
        }

        .delete-button {
            margin-top: 8px;

            background: #ef4444;
        }

        .status {
            margin-top: 12px;

            font-size: 13px;
        }

    </style>

</head>


<body>

    <h2>
        Resume One-Click
    </h2>

    <div class="description">
        Save your resume once and use it
        on job applications.
    </div>


    <div class="resume-box">

        <div
            id="fileName"
            class="file-name"
        >
            No resume saved
        </div>

        <div
            id="fileSize"
            class="file-size"
        >
        </div>

    </div>


    <input
        id="resumeInput"
        type="file"
        accept=".pdf,.doc,.docx"
    />


    <button id="saveButton">
        Save Resume
    </button>


    <button
        id="deleteButton"
        class="delete-button"
    >
        Delete Resume
    </button>


    <div
        id="status"
        class="status"
    >
    </div>


    <script src="../storage/resume-db.js"></script>

    <script src="popup.js"></script>

</body>

</html>
